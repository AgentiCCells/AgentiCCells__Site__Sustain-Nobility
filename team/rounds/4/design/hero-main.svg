<rect width="1366" height="44" fill="#0b1612"/>
<text x="56" y="27" font-family="Public Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#ede8dc"><tspan font-weight="700">Proposal, not the official site.</tspan> A proposal by AgentiCCells, made with SUSTAIN-NOBILITY's agreement; their official site is sustain-nobility.com. To start the Readiness Check or book a call, use their site.</text>
