<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 820" width="1366" height="820" role="img" aria-labelledby="t d">
<title id="t">Mock-up: Evidence Seal hero for the main design, 1366 px</title>
<desc id="d">Proposal sketch by designer.sustain-nobility@AgentiCCells.dinis, round 4. Slim dark notice bar, designs strip, header with a Designs chip, then a deep green hero: the published question set very large on the left and a seal of six equal segments, one per area, on the right. System fonts stand in for Fraunces and Public Sans.</desc>
